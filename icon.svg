<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="박현민 AI 오피스">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9C6A38"/>
      <stop offset="1" stop-color="#74481F"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF9"/>
      <stop offset="1" stop-color="#F6E8D5"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- warm glow -->
  <circle cx="392" cy="128" r="86" fill="#EE8A3C" opacity=".92"/>
  <circle cx="392" cy="128" r="112" fill="#EE8A3C" opacity=".18"/>

  <!-- office block -->
  <rect x="104" y="196" width="304" height="212" rx="30" fill="url(#paper)"/>
  <!-- roof -->
  <rect x="128" y="160" width="256" height="52" rx="24" fill="#F3E1C8"/>
  <!-- windows -->
  <rect x="140" y="222" width="52" height="44" rx="12" fill="#8B5A2B"/>
  <rect x="208" y="222" width="52" height="44" rx="12" fill="#8B5A2B"/>
  <rect x="276" y="222" width="52" height="44" rx="12" fill="#8B5A2B"/>
  <rect x="140" y="286" width="52" height="44" rx="12" fill="#8B5A2B" opacity=".82"/>
  <rect x="208" y="286" width="52" height="44" rx="12" fill="#8B5A2B" opacity=".82"/>
  <rect x="276" y="286" width="52" height="44" rx="12" fill="#8B5A2B" opacity=".82"/>
  <!-- door -->
  <rect x="216" y="344" width="80" height="64" rx="16" fill="#C08A52"/>
  <!-- green status dot -->
  <circle cx="322" cy="376" r="15" fill="#3E9C74"/>
  <circle cx="322" cy="376" r="23" fill="#3E9C74" opacity=".22"/>
</svg>
